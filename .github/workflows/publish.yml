name: Iran Alarm News Publisher

on:
  workflow_dispatch:

  push:
    branches:
      - main
    # تغییرات پنل مدیریت (config.json) و وضعیت ناشر اجرای جدید ایجاد نمی‌کنند
    paths-ignore:
      - "config.json"
      - "data/**"
      - "README.md"

  schedule:
    # اجرای مجدد خودکار در دقیقه ۱۱ و ۴۱ هر ساعت
    - cron: "11,41 * * * *"

concurrency:
  group: iran-alarm-news-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news publisher
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}

          # فقط برای ارسال هشدار خطا به Owner
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}

          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONFIG_BRANCH: main
          CONFIG_PATH: config.json

          PYTHONUNBUFFERED: "1"

        run: |
          set -u

          INTERVAL=300
          RUN_FOR=$((340 * 60))
          START_TIME=$(date +%s)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Iran Alarm News publisher started."
          echo "Checking every 5 minutes."

          while true; do

            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            if [ "$ELAPSED" -ge "$RUN_FOR" ]; then
              echo "Execution time reached. Exiting."
              break
            fi

            # تغییر config.json (پنل مدیریت) یا data/ نیازی به راه‌اندازی مجدد ندارد؛
            # اما اگر کد یا workflow عوض شده باشد، اجرای بعدی با کد جدید شروع می‌شود.
            git fetch origin main

            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then

              if git diff --name-only HEAD...origin/main | grep -qv -E '^(config\.json|data/)'; then
                echo "Code changed in the repository."
                echo "Restarting through the next scheduled workflow."
                break
              fi

              if ! git rebase origin/main; then
                git rebase --abort
                echo "Could not sync with the repository. Stopping."
                break
              fi

            fi

            CYCLE_START=$(date +%s)

            echo "----------------------------------------"
            echo "Starting news check..."
            date -u
            echo "----------------------------------------"

            timeout 240 python main.py || {
              echo "Publisher returned an error or timed out."
            }

            # ذخیره وضعیت پیام‌ها و آمار (برای پنل مدیریت)
            git add data

            if ! git diff --cached --quiet; then

              git commit -m "Update Iran Alarm publisher state"

              PUSHED=0
              RESTART=0

              # پنل مدیریت فقط config.json را عوض می‌کند و ناشر فقط data/ را؛
              # پس با rebase هر دو تغییر حفظ می‌شود.
              for ATTEMPT in 1 2 3; do

                git fetch origin main

                if git diff --name-only HEAD...origin/main | grep -qv -E '^(config\.json|data/)'; then
                  RESTART=1
                fi

                if ! git rebase origin/main; then
                  git rebase --abort
                  break
                fi

                if git push origin HEAD:main; then
                  PUSHED=1
                  break
                fi

                sleep 5

              done

              if [ "$PUSHED" -ne 1 ]; then
                echo "Could not push state. Will retry in next run."
                break
              fi

              echo "Publisher state saved."

              if [ "$RESTART" -eq 1 ]; then
                echo "Code changed during this cycle. Restarting through the next scheduled workflow."
                break
              fi

            fi

            CYCLE_END=$(date +%s)
            CYCLE_DURATION=$((CYCLE_END - CYCLE_START))

            SLEEP_TIME=$((INTERVAL - CYCLE_DURATION))

            if [ "$SLEEP_TIME" -lt 10 ]; then
              SLEEP_TIME=10
            fi

            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))
            REMAINING=$((RUN_FOR - ELAPSED))

            if [ "$SLEEP_TIME" -gt "$REMAINING" ]; then
              SLEEP_TIME=$REMAINING
            fi

            if [ "$SLEEP_TIME" -le 0 ]; then
              break
            fi

            echo "Next check in $SLEEP_TIME seconds."
            sleep "$SLEEP_TIME"

          done

          echo "Iran Alarm News publisher stopped."
