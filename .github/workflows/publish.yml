
name: Iran Alarm News Publisher

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    # کرون فقط نقش زنده‌کننده را دارد.
    - cron: '11,41 * * * *'

permissions:
  contents: write

# جلوگیری از اجرای هم‌زمان چند نسخه ربات
concurrency:
  group: iran-alarm-news-bot
  cancel-in-progress: false

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    # حداکثر زمان اجرای هر Job
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run news bot in self-sustaining loop
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          DESTINATION_CHANNEL: '@Iran_Alarm_News'
          PYTHONUNBUFFERED: '1'

        run: |
          INTERVAL=300
          RUN_FOR=$((340*60))
          START=$SECONDS
          CYCLE=0

          # آخرین نسخه کد که این اجرا بر اساس آن شروع شده
          BASE_SHA=$(git rev-parse HEAD)

          git config user.name "Iran Alarm News Bot"
          git config user.email "bot@users.noreply.github.com"

          while [ $((SECONDS - START)) -lt $RUN_FOR ]; do

            CYCLE=$((CYCLE+1))
            CYCLE_START=$SECONDS

            echo "=========================================="
            echo "Cycle: $CYCLE"
            echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "=========================================="

            # بررسی اینکه کد جدیدی روی main قرار نگرفته باشد
            REMOTE_SHA=$(git ls-remote origin refs/heads/main | cut -f1)

            if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
              echo "نسخه جدیدی از کد منتشر شده؛ اجرای فعلی متوقف می‌شود."
              break
            fi

            # اجرای ربات؛ حداکثر ۴ دقیقه برای هر چرخه
            if timeout 240 python main.py; then
              echo "ربات با موفقیت اجرا شد."
            else
              STATUS=$?
              echo "::warning::اجرای ربات با کد $STATUS تمام شد."
            fi

            # ذخیره وضعیت پردازش پیام‌ها در GitHub
            git add data/state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update news bot state"

              if git push origin HEAD:main; then
                # تغییر خودمان نباید به‌عنوان نسخه جدید تشخیص داده شود.
                BASE_SHA=$(git rev-parse HEAD)
                echo "وضعیت پیام‌های پردازش‌شده ذخیره شد."
              else
                echo "::error::ذخیره وضعیت در GitHub ناموفق بود."
                exit 1
              fi
            else
              echo "تغییری در فایل وضعیت وجود ندارد."
            fi

            # محاسبه زمان باقی‌مانده تا چرخه بعدی
            ELAPSED=$((SECONDS - CYCLE_START))
            SLEEP=$((INTERVAL - ELAPSED))

            if [ "$SLEEP" -lt 10 ]; then
              SLEEP=10
            fi

            echo "چرخه $CYCLE تمام شد."
            echo "مدت اجرا: ${ELAPSED} ثانیه"
            echo "${SLEEP} ثانیه تا بررسی بعدی صبر می‌کنیم."

            sleep "$SLEEP"

          done

          echo "اجرای طولانی تمام شد؛ کرون بعدی ربات را دوباره زنده می‌کند."
